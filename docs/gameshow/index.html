<title>เกมโชว์ลับ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* layout: one centred column like a TV frame: pixel scene on top, story below, choices as stage buttons. single deliberate dark look */
:root{color-scheme:dark;--bg:#14101c;--panel:#201a2c;--line:#3a3150;--ink:#f1ecf7;--ink2:#b4a9c6;--amber:#ffb000;--pink:#e0457b;--teal:#2fa3a3;--warn:#d9674a;
--f-d:"Prompt","Noto Sans Thai",system-ui,sans-serif;--f-b:"Noto Sans Thai",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.65;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--f-d);font-weight:600;font-size:28px;margin:0;letter-spacing:.01em;color:var(--amber)}
h1 small{display:block;font-family:var(--f-b);font-weight:400;font-size:14px;color:var(--ink2);letter-spacing:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
label{display:block;font-size:14px;color:var(--ink2);margin-bottom:4px}
input[type=text],input[type=number]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:10px 12px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 16px;min-height:40px}
button:hover{border-color:var(--amber)}button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button.go{background:var(--amber);border-color:var(--amber);color:#1b1306;font-weight:500}
button.stop{border-color:var(--warn);color:var(--warn)}
button[aria-pressed=true]{background:var(--pink);border-color:var(--pink);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
canvas{display:block;width:100%;max-width:100%;aspect-ratio:3/2;image-rendering:pixelated;background:#000;border:2px solid var(--line);border-radius:6px}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:13px;color:var(--ink2)}
.meter i{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:3px}.meter b{display:block;height:100%;background:var(--amber)}
.meter.t b{background:var(--teal)}.meter.n b{background:var(--pink)}
.story{white-space:pre-wrap;font-size:17px}
.act{font-family:var(--f-d);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{text-align:left;border-radius:10px;padding:12px 14px;line-height:1.45}
.muted{color:var(--ink2);font-size:14px}
.log{font-size:14px;color:var(--ink2);margin:0;padding-left:20px}
.hint{background:#2a2118;border:1px solid #5a4528;border-radius:8px;padding:10px 12px;font-size:14px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--amber);border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:420px){.meters{grid-template-columns:repeat(2,1fr)}}
</style>
<main id="app"></main>
<script>
(function () {
  'use strict';
  const KEY = 'secret-gameshow.v1', W = 96, H = 64, FR = 6;
  const PAL = ['#14101c', '#2a2236', '#3a2d52', '#ffd36b', '#f2c4a0', '#d99c78', '#3b2418', '#e8b868', '#e0457b', '#2fa3a3', '#f4f0f8', '#0b0910', '#ff7a9a', '#d93b3b', '#6b5a9e', '#ffb000'];
  const HAIR = { brown: '#3b2418', black: '#15101a', blonde: '#e8b868' };
  const MINOR_RX = /เด็ก|เยาวชน|อนุบาล|ประถม|มัธยม|ม\.\s*[0-9]|นักเรียน|ขวบ|ด\.ญ\.|ไม่บรรลุ|schoolgirl|underage|minor|teen|child/i;
  const ACTS = [
    { n: 'เปิดรายการ', lv: 1, bg: 'stage', gap: 26, host: 1, brief: 'พิธีกรเปิดรายการ อธิบายกติกาแบบตีความผิด ผู้เข้าแข่งขันทั้งสองทักทายกันครั้งแรกบนเวที' },
    { n: 'ด่านจับมือสบตา', lv: 1, bg: 'stage', gap: 14, host: 1, brief: 'ภารกิจแรก จับมือและสบตากันค้างสิบวินาทีโดยห้ามหัวเราะ' },
    { n: 'ด่านนวดไหล่', lv: 2, bg: 'booth', gap: 9, host: 1, brief: 'ห้องแยกส่วนตัวที่มีกล้อง ภารกิจให้นวดไหล่กันโดยห้ามพูด' },
    { n: 'ด่านกระซิบ', lv: 2, bg: 'booth', gap: 7, host: 0, brief: 'กระซิบคำชมที่ไม่เคยพูดกับใคร เสียงต้องเบาจนไมค์จับไม่ได้' },
    { n: 'ด่านคำถามความลับ', lv: 3, bg: 'dark', gap: 5, host: 0, brief: 'นั่งใกล้กัน ตอบคำถามความลับจากการ์ด ทุกคำตอบเปลี่ยนบรรยากาศ' },
    { n: 'ด่านปิดตา', lv: 3, bg: 'dark', gap: 5, host: 0, brief: 'ปิดตาข้างหนึ่งแล้วเดาว่ากำลังโดนอะไรอยู่ ภารกิจนี้เธอสั่งหยุดได้ทุกเมื่อ' },
    { n: 'ด่านร่วมกัน', lv: 4, bg: 'booth', gap: 4, host: 0, brief: 'ภารกิจที่ต้องทำให้อีกฝ่ายหลุดเสียงก่อน คะแนนมาจากความจริงใจ' },
    { n: 'ด่านสุดท้าย', lv: 5, bg: 'dark', gap: 3, host: 0, brief: 'ผู้ชนะเลือกเองว่าจะจบรายการอย่างไร ไม่มีกฎ ไม่มีเวลา เหลือแค่สองคน' }
  ];
  const LV = ['', 'จับมือ สบตา คำพูดล้อเล่น', 'สัมผัสบนเสื้อผ้า นวด จูบเบาๆ', 'จูบ ลูบไล้ ถอดบางชิ้น เสียงเริ่มหลุด', 'ฉากรักเต็มรูปแบบ ใช้คำตรงๆ โดยเธอคุมจังหวะ', 'เข้มข้นที่สุด ยังคงเต็มใจและมีคำหยุด'];
  const $ = s => document.querySelector(s), app = $('#app');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), num = v => clamp(Math.round(Number(v) || 0), -15, 15);
  let wantStop = false, st = null, busy = false, cap = null, timer = null, tick = 0, ctl = null;

  /* ---------- pixel scene ---------- */
  const DIG = { 0: '111101101101111', 1: '010110010010111', 2: '111001111100111', 3: '111001111001111', 4: '101101111001001', 5: '111100111001111', 6: '111100111101111', 7: '111001001010010', 8: '111101111101111', 9: '111101111001111' };
  function frame(sc, t) {
    const g = new Uint8Array(W * H), px = (x, y, c) => { x |= 0; y |= 0; if (x >= 0 && x < W && y >= 0 && y < H) g[y * W + x] = c; }, rect = (x, y, w, h, c) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) px(x + i, y + j, c); }, disc = (cx, cy, r, c) => { for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) if (i * i + j * j <= r * r + 1) px(cx + i, cy + j, c); };
    const dark = sc.bg === 'dark', fx = sc.fx || [];
    rect(0, 0, W, 41, dark ? 0 : 2); rect(0, 41, W, 23, dark ? 0 : 1); for (let y = 44; y < H; y += 7) rect(0, y, W, 1, 0);
    if (sc.bg === 'stage') for (let x = 0; x < W; x += 4) { px(x, 3, ((x / 4 + t) % 3 === 0) ? 15 : 13); px(x + 1, 3, ((x / 4 + t) % 3 === 0) ? 15 : 13); }
    if (sc.bg === 'booth') { rect(6, 10, 14, 31, 11); rect(8, 12, 10, 27, 0); disc(80, 14, 7, 10); disc(80, 14, 5, 2); const a = (sc.time || 0) / 90 * 6.283; for (let k = 0; k < 5; k++) px(80 + Math.sin(a) * k, 14 - Math.cos(a) * k, 15); px(80, 14, 11); }
    const beams = dark ? [48] : [26 + Math.sin(t / 6 * 6.283) * 6, 68 - Math.sin(t / 6 * 6.283) * 6];
    beams.forEach(cx => { for (let y = 0; y < 41; y++) { const half = 2 + y * 0.28; for (let x = cx - half; x <= cx + half; x++) if (((x | 0) + y) % 2 === 0) px(x, y, 14); } });
    function person(x, y, kind, pose) {
      const bob = (t % 2) && pose !== 'still' ? 0 : 1, yy = y + bob, body = kind === 'her' ? 8 : kind === 'host' ? 11 : 9, hair = kind === 'her' ? 6 : kind === 'host' ? 7 : 11;
      rect(x - 4, yy - 6, 3, 6, 11); rect(x + 1, yy - 6, 3, 6, 11); if (kind === 'her') rect(x - 5, yy - 9, 11, 4, 8);
      rect(x - 4, yy - 17, 9, 11, body); if (kind === 'host') { rect(x - 1, yy - 17, 3, 3, 13); }
      const raise = pose === 'wave' ? (t % 2 ? 3 : 0) : 0;
      if (pose === 'hold') { rect(x - 6, yy - 15, 2, 7, body); rect(x + 5, yy - 15, 5, 2, body); } else { rect(x - 6, yy - 16, 2, 9, body); rect(x + 5, yy - 16 - raise, 2, 9, body); }
      disc(x, yy - 22, 5, 4); rect(x - 5, yy - 28, 11, 4, hair); rect(x - 5, yy - 25, 2, 3, hair);
      const blink = t % 6 === 5; if (blink) { px(x - 2, yy - 22, 11); px(x + 2, yy - 22, 11); } else { px(x - 2, yy - 23, 11); px(x + 2, yy - 23, 11); }
      px(x - 1, yy - 19, 5); px(x, yy - 19, 11); px(x + 1, yy - 19, 5);
      if (kind === 'her' && fx.includes('blush')) { px(x - 4, yy - 20, 12); px(x - 3, yy - 20, 12); px(x + 3, yy - 20, 12); px(x + 4, yy - 20, 12); }
      if (kind === 'her' && fx.includes('sweat')) px(x + 6, yy - 26 + t % 3, 10);
      if (kind === 'her' && fx.includes('heart')) { const hy = yy - 36 - t % 3; [[-2, 0], [2, 0], [-3, 1], [-1, 1], [1, 1], [3, 1], [-2, 2], [0, 2], [2, 2], [-1, 3], [1, 3], [0, 4]].forEach(p => px(x + p[0], hy + p[1], 13)); }
    }
    const cx = 48, hx = cx - sc.gap / 2, mx = cx + sc.gap / 2; person(mx, 56, 'him', sc.pose || 'stand'); person(hx, 56, 'her', sc.pose === 'wave' ? 'wave' : 'stand'); if (sc.host) person(88, 50, 'host', 'wave');
    if (fx.includes('spark')) for (let i = 0; i < 6; i++) { const s = (i * 53 + t * 17) % (W * 30); px(s % W, 4 + (s / W | 0) % 30, 15); }
    if (fx.includes('confetti')) for (let i = 0; i < 14; i++) px((i * 37 + t * 3) % W, (i * 11 + t * 6) % H, [13, 15, 14, 12][i % 4]);
    const m = clamp(Math.round(sc.time || 0), 0, 99), d = [String(m).padStart(2, '0')[0], String(m).padStart(2, '0')[1]]; rect(3, 55, 15, 8, 11);
    d.forEach((ch, k) => { const bits = DIG[ch]; for (let q = 0; q < 15; q++) if (bits[q] === '1') px(5 + k * 6 + q % 3, 57 + (q / 3 | 0), 15); });
    return g;
  }
  function paint(cv, g) { const c = cv.getContext('2d'), im = c.createImageData(W, H); for (let i = 0; i < g.length; i++) { const h = PAL[g[i]], o = i * 4; im.data[o] = parseInt(h.slice(1, 3), 16); im.data[o + 1] = parseInt(h.slice(3, 5), 16); im.data[o + 2] = parseInt(h.slice(5, 7), 16); im.data[o + 3] = 255; } c.putImageData(im, 0, 0); }

  /* ---------- gif (own LZW, 16 colours) ---------- */
  function lzw(idx, minCode) {
    const clear = 1 << minCode, eoi = clear + 1, out = []; let size = minCode + 1, next = eoi + 1, dict = new Map(), cur = 0, bits = 0;
    const emit = c => { cur |= c << bits; bits += size; while (bits >= 8) { out.push(cur & 255); cur >>>= 8; bits -= 8; } };
    emit(clear); let p = idx[0];
    for (let i = 1; i < idx.length; i++) { const k = idx[i], key = p * 256 + k, v = dict.get(key); if (v !== undefined) { p = v; continue; } emit(p); if (next < 4096) { dict.set(key, next++); if (next > (1 << size) && size < 12) size++; } else { emit(clear); dict.clear(); size = minCode + 1; next = eoi + 1; } p = k; }
    emit(p); emit(eoi); if (bits > 0) out.push(cur & 255); return out;
  }
  function gif(frames, k) {
    const w = W * k, h = H * k, b = []; const w16 = v => b.push(v & 255, (v >> 8) & 255);
    'GIF89a'.split('').forEach(c => b.push(c.charCodeAt(0))); w16(w); w16(h); b.push(0xF3, 0, 0); PAL.forEach(x => b.push(parseInt(x.slice(1, 3), 16), parseInt(x.slice(3, 5), 16), parseInt(x.slice(5, 7), 16)));
    b.push(0x21, 0xFF, 0x0B); 'NETSCAPE2.0'.split('').forEach(c => b.push(c.charCodeAt(0))); b.push(3, 1, 0, 0, 0);
    frames.forEach(g => { b.push(0x21, 0xF9, 4, 0, 22, 0, 0, 0, 0x2C); w16(0); w16(0); w16(w); w16(h); b.push(0); const idx = new Uint8Array(w * h); for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) idx[y * w + x] = g[((y / k) | 0) * W + ((x / k) | 0)]; b.push(4); const data = lzw(idx, 4); for (let i = 0; i < data.length; i += 255) { const n = Math.min(255, data.length - i); b.push(n); for (let j = 0; j < n; j++) b.push(data[i + j]); } b.push(0); });
    b.push(0x3B); return new Uint8Array(b);
  }

  /* ---------- state ---------- */
  const fresh = s => ({ setup: s, act: 0, v: { nerve: 50, trust: 50, time: 90, score: 0 }, scene: null, log: [], over: false, lvl: s.lvl });
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function load() { try { const o = JSON.parse(localStorage.getItem(KEY) || 'null'); if (o && o.setup && o.v && o.setup.age >= 20 && !MINOR_RX.test(o.setup.her + ' ' + o.setup.him)) st = o; } catch (e) {} }
  const sceneArt = (a, art) => Object.assign({ bg: ACTS[Math.min(a, 7)].bg, gap: ACTS[Math.min(a, 7)].gap, host: ACTS[Math.min(a, 7)].host, fx: [], pose: 'stand', time: st.v.time }, art || {});

  /* ---------- story ---------- */
  function fallback(a) { const A = ACTS[a]; return { text: A.brief + '\n\n(เปิดหน้านี้ใน Claude เพื่อให้ Claude เขียนฉากเต็ม ตอนนี้เป็นเนื้อเรื่องย่อ)', choices: [{ t: 'กล้าลุยเลย', nerve: 10, trust: 0, time: -5, score: 5 }, { t: 'ขอจังหวะ ถามก่อนทำ', nerve: 0, trust: 10, time: -8, score: 5 }, { t: 'ล้อเล่นแก้เขิน', nerve: 5, trust: 5, time: -6, score: 3 }], art: { fx: ['spark'] } }; }
  function prompt(kind, choice) {
    const s = st.setup, a = ACTS[Math.min(st.act, 7)], lvl = Math.min(a.lv, st.lvl), v = st.v;
    const head = `คุณคือนักเขียนนวนิยายผู้ใหญ่แนวตลกที่ซื่อสัตย์ เรื่อง "เกมโชว์ลับ": ${s.her} (อายุ ${s.age} ปี ผู้ใหญ่) เป็นผู้เข้าแข่งขันที่สมัครและลงนามเอง คู่แข่งคือ ${s.him} (ผู้ใหญ่) พิธีกรชื่อ ${s.host}`;
    const rules = `กติกาการเขียน
1. ภาษาไทย บุรุษที่หนึ่ง "ฉัน" คือ ${s.her} เปิดฉากด้วยบทพูดหรือการกระทำกลางเหตุการณ์ ห้ามเปิดด้วยอากาศหรือแสง
2. เสียงที่สามคือผู้ชมในสตูดิโอที่ไม่รู้ความจริงและตีความผิดให้ขำ แทรก 1–2 ครั้ง ไม่ให้เสียงนั้นข่มเธอ
3. ทุกอย่างอยู่ในกติกาที่ทุกคนตกลง เธอเลือกเองทุกขั้น ไม่มีใครบังคับ ขู่ วางยา รุม หรือถ่ายโดยเธอไม่ยินยอม ถ้าเธอปัดหรือบอกว่า "พอก่อน" ทุกอย่างหยุดทันทีและทุกคนเคารพ ไม่มีเด็กหรือกลิ่นเด็ก ไม่เขียนผลการตั้งครรภ์
4. เมื่อถึงช่วงเซ็กส์ ใช้คำตรงๆ ตามระดับที่อนุญาต เน้นการกระทำ ความรู้สึกที่ขัดกับคำพูด และเสียงของเธอ เธอเป็นฝ่ายคุมจังหวะ ตัดบรรยากาศยาวๆ`;
    const nowv = `ค่าตอนนี้: ความกล้า ${v.nerve}/100 · ความไว้ใจ ${v.trust}/100 · เวลาที่เหลือ ${v.time} นาที · คะแนน ${v.score}\nสิ่งที่ผ่านมา: ${st.log.slice(-4).join(' / ') || 'เพิ่งเริ่ม'}`;
    if (kind === 'end') return `${head}\n${rules}\n${nowv}\nเขียนฉากจบรายการ 120–200 ความยาวของคำ ${choice === 'stop' ? 'เธอบอก "พอก่อน" และรายการหยุดทันที ปิดอย่างอบอุ่น ไม่ตัดสิน ไม่มีเนื้อหาทางเพศในฉากนี้' : 'ตามผลที่ผ่านมา ปิดด้วยปมเล็กๆ ที่ชวนให้อยากเล่นซีซั่นถัดไป'} ตอบเป็น JSON เท่านั้น: {"text":"..."}`;
    return `${head}\n${rules}\nด่านนี้ (${st.act + 1}/8): ${a.n} — ${a.brief}\nระดับที่เขียนได้ ${lvl}/5: ${LV[lvl]} (อย่าเกินระดับนี้ แต่ใช้ให้เต็มและสนุก)\n${nowv}\nผู้เล่นเพิ่งเลือก: ${choice || 'เริ่มด่าน'}\nเขียนฉากของด่านนี้ 160–280 คำ แล้วเสนอทางเลือก 3 ทางที่ต่างกันจริง (กล้า, ระวัง, ขี้เล่น) เป็นการกระทำของเธอ แต่ละข้อไม่เกิน 40 ตัวอักษร พร้อมผลต่อค่า (จำนวนเต็ม -15 ถึง 15)\nตอบเป็น JSON เท่านั้น: {"text":"...","choices":[{"t":"...","nerve":0,"trust":0,"time":0,"score":0}],"art":{"fx":["blush"|"heart"|"sweat"|"spark"|"confetti"],"pose":"stand"|"wave"|"hold"}}`;
  }
  function cleanScene(o, a) {
    const ch = (Array.isArray(o && o.choices) ? o.choices : []).slice(0, 3).map(c => ({ t: String(c && c.t || '').slice(0, 60), nerve: num(c && c.nerve), trust: num(c && c.trust), time: num(c && c.time), score: num(c && c.score) })).filter(c => c.t);
    const art = o && o.art || {}, okFx = ['blush', 'heart', 'sweat', 'spark', 'confetti'];
    return { text: String(o && o.text || '').slice(0, 4000), choices: ch.length >= 2 ? ch : fallback(a).choices, art: { fx: (Array.isArray(art.fx) ? art.fx : []).filter(x => okFx.includes(x)).slice(0, 3), pose: ['stand', 'wave', 'hold'].includes(art.pose) ? art.pose : 'stand' } };
  }
  async function ask(kind, choice) {
    if (!cap) throw new Error('nocap');

    return res;
  }
  async function step(choice, delta) {
    if (busy) return; busy = true; render();
    try {
      if (delta) { const v = st.v; v.nerve = clamp(v.nerve + delta.nerve, 0, 100); v.trust = clamp(v.trust + delta.trust, 0, 100); v.time = clamp(v.time - 10 + delta.time, 0, 99); v.score += delta.score; st.log.push(`ด่าน ${st.act}: ${choice}`); }
      if (st.act >= 8 || choice === 'stop') { st.over = true; let t = 'จบรายการ'; try { t = String((await ask('end', choice === 'stop' ? 'stop' : 'end')).text || t); } catch (e) { t = choice === 'stop' ? 'เธอบอกว่าพอก่อน รายการหยุดทันที และทุกคนปรบมือให้การตัดสินใจนั้น' : 'รายการจบลง และมีจดหมายเชิญซีซั่นสองรออยู่หน้าห้องแต่งตัว'; } st.scene = { text: t.slice(0, 3000), choices: [], art: { fx: choice === 'stop' ? [] : ['confetti'] } }; }
      else { let o; try { o = cleanScene(await ask('scene', choice), st.act); } catch (e) { o = fallback(st.act); if (e && e.code === 'rate_limited') toast('ช้าลงหน่อย ลองอีกครั้ง'); } st.scene = o; st.act++; }
    } finally { busy = false; save(); render(); if (wantStop) { wantStop = false; step('stop', null); } }
  }
  let tmsg = ''; function toast(m) { tmsg = m; render(); }

  /* ---------- ui ---------- */
  function el(tag, props, kids) { const e = document.createElement(tag); Object.entries(props || {}).forEach(([k, v]) => { if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); }); (kids || []).forEach(c => e.append(c)); return e; }
  function meter(label, v, cls, shown) { return el('div', { class: 'meter ' + (cls || '') }, [document.createTextNode(label + ' ' + (shown != null ? shown : Math.round(v))), el('i', {}, [el('b', { style: 'width:' + clamp(v, 0, 100) + '%' })])]); }
  function setupView() {
    const f = { her: 'ฟ้า', him: 'ภัทร', host: 'พิธีกรโอ๋', age: 27, hair: 'brown', lvl: 3 };
    const inp = (id, label, val, type) => el('div', {}, [el('label', { for: id, text: label }), el('input', { id, type: type || 'text', value: val, maxlength: 24 })]);
    const lvlRow = el('div', { class: 'row', id: 'lvl' }); [1, 2, 3, 4, 5].forEach(n => lvlRow.append(el('button', { type: 'button', 'aria-pressed': String(n === f.lvl), 'data-n': n, text: String(n), onclick(e) { f.lvl = n; lvlRow.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.n) === n))); } })));
    const hairRow = el('div', { class: 'row' }); Object.keys(HAIR).forEach(k => hairRow.append(el('button', { type: 'button', 'aria-pressed': String(k === f.hair), 'data-k': k, text: { brown: 'น้ำตาล', black: 'ดำ', blonde: 'บลอนด์' }[k], onclick() { f.hair = k; hairRow.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === k))); } })));
    const msg = el('p', { class: 'muted', id: 'smsg' });
    const p = el('section', { class: 'panel' }, [el('div', { class: 'grid' }, [inp('fHer', 'ชื่อของเธอ (ผู้เล่น)', f.her), inp('fAge', 'อายุของเธอ (20 ขึ้นไป)', f.age, 'number'), inp('fHim', 'ชื่อคู่แข่ง', f.him), inp('fHost', 'ชื่อพิธีกร', f.host)]), el('label', { text: 'สีผมของเธอ', style: 'margin-top:12px' }), hairRow, el('label', { text: 'ระดับความเข้มสูงสุดที่ยอมให้เขียน (1 เบา ถึง 5 เข้มที่สุด)', style: 'margin-top:12px' }), lvlRow, el('p', { class: 'muted', text: 'ทุกคนในเรื่องเป็นผู้ใหญ่ เต็มใจ ปัดภารกิจได้ทุกข้อ และปุ่ม "พอก่อน" หยุดรายการทันทีเสมอ' }), msg, el('div', { class: 'row', style: 'margin-top:8px' }, [el('button', { class: 'go', type: 'button', text: 'เริ่มรายการ', onclick() {
      const her = $('#fHer').value.trim(), him = $('#fHim').value.trim(), host = $('#fHost').value.trim(), age = parseInt($('#fAge').value, 10);
      if (!her || !him || !host) { msg.textContent = 'ใส่ชื่อให้ครบทั้งสามช่อง'; return; } if (!(age >= 20 && age <= 90)) { msg.textContent = 'ผู้เล่นต้องเป็นผู้ใหญ่ อายุ 20–90 ปี'; return; } if (MINOR_RX.test(her + ' ' + him + ' ' + host)) { msg.textContent = 'ชื่อนี้ใช้ไม่ได้'; return; }
      st = fresh({ her, him, host, age, hair: f.hair, lvl: f.lvl }); PAL[6] = HAIR[f.hair]; save(); step('เริ่มรายการ', null);
    } })])]);
    return p;
  }
  function gameView() {
    const A = ACTS[Math.min(Math.max(st.act - 1, 0), 7)], sc = st.scene || fallback(0), art = sceneArt(Math.max(st.act - 1, 0), sc.art);
    const cv = el('canvas', { width: W, height: H, role: 'img', 'aria-label': 'ภาพพิกเซลของฉากในสตูดิโอ' }); cv.id = 'cv'; cv._art = art;
    const kids = [cv, el('div', { class: 'meters' }, [meter('ความกล้า', st.v.nerve, 'n'), meter('ความไว้ใจ', st.v.trust, 't'), meter('เวลา (นาที)', st.v.time * 100 / 90, '', st.v.time), meter('คะแนน', clamp(50 + st.v.score * 2, 0, 100), '', st.v.score)]),
      el('div', { class: 'act', text: st.over ? 'จบรายการ' : `ด่าน ${st.act}/8 · ${A.n}` })];
    if (busy) kids.push(el('p', { class: 'muted' }, [el('span', { class: 'spin' }), document.createTextNode('กำลังเขียนฉาก…')]));
    else { kids.push(el('div', { class: 'story', text: sc.text })); if (!cap) kids.push(el('div', { class: 'hint', text: 'ยังไม่ได้เชื่อม Claude ตอนนี้เล่นด้วยเนื้อเรื่องย่อ เปิดหน้านี้ในแอป Claude เพื่อให้เขียนฉากเต็ม' })); }
    if (!busy && !st.over) { const ch = el('div', { class: 'choices' }); sc.choices.forEach(c => ch.append(el('button', { type: 'button', text: c.t + `   (${[c.nerve && 'กล้า ' + (c.nerve > 0 ? '+' : '') + c.nerve, c.trust && 'ไว้ใจ ' + (c.trust > 0 ? '+' : '') + c.trust].filter(Boolean).join(' · ') || 'ไม่เปลี่ยนค่า'})`, onclick() { step(c.t, c); } }))); ch.append(el('button', { type: 'button', text: 'ปัดภารกิจนี้ (ข้ามไปด่านถัดไป)', onclick() { step('ปัดภารกิจนี้ พิธีกรยอมรับ', { nerve: 0, trust: 0, time: 0, score: -3 }); } })); kids.push(ch); }
    const bar = el('div', { class: 'row' }); if (!busy && !st.over) bar.append(el('button', { class: 'stop', type: 'button', text: 'พอก่อน', onclick() { step('stop', null); } })); else if (busy) bar.append(el('button', { class: 'stop', type: 'button', text: 'พอก่อน', onclick() { wantStop = true; if (ctl) ctl.abort(); } }));
    bar.append(el('button', { type: 'button', text: 'บันทึก GIF ของฉากนี้', onclick: saveGif }), el('button', { type: 'button', text: 'เริ่มเรื่องใหม่', onclick() { st = null; try { localStorage.removeItem(KEY); } catch (e) {} render(); } })); kids.push(bar);
    if (st.log.length) kids.push(el('details', {}, [el('summary', { class: 'muted', text: 'เส้นทางที่เลือกมา' }), el('ol', { class: 'log' }, st.log.map(l => el('li', { text: l })))]));
    if (tmsg) { kids.push(el('p', { class: 'muted', text: tmsg })); tmsg = ''; }
    return el('section', { class: 'panel', style: 'display:flex;flex-direction:column;gap:12px' }, kids);
  }
  async function saveGif() {
    const cv = $('#cv'); if (!cv) return; const dl = await window.claude?.use?.('downloads'); if (!dl) { toast('เปิดหน้านี้ในแอป Claude เพื่อบันทึกไฟล์'); return; }
    const fr = []; for (let t = 0; t < FR; t++) fr.push(frame(cv._art, t));
    try { await dl.save({ filename: 'secret-gameshow-act' + st.act + '.gif', data: new Blob([gif(fr, 5)], { type: 'image/gif' }) }); } catch (e) { toast('ยังไม่ได้บันทึก'); }
  }
  function render() {
    app.replaceChildren(el('h1', { text: 'เกมโชว์ลับ' }, [el('small', { text: 'เล่นเป็นผู้เข้าแข่งขันและเลือกทางเอง ผู้ใหญ่ทุกคน ปัดภารกิจได้ทุกข้อ' })]));
    app.append(st ? gameView() : setupView());
    const cv = $('#cv'); if (cv) { cv.getContext('2d'); paint(cv, frame(cv._art, tick % FR)); }
  }
  function loop() { const cv = $('#cv'); if (cv) { tick++; paint(cv, frame(cv._art, tick % FR)); } }
  load(); if (st) PAL[6] = HAIR[st.setup.hair] || PAL[6];
  render();
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) timer = setInterval(loop, 230);
  window.claude?.use?.('sample').then(s => { cap = s || null; if (st && st.scene && !busy) render(); }).catch(() => {});
  if (st && !st.scene && !busy) step('ต่อจากเดิม', null);
})();
</script>
